<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Stage floor line -->
  <line x1="6" y1="43" x2="42" y2="43" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Wooden Kingdom Hall Podium / Pulpit -->
  <!-- Base plate -->
  <rect x="15" y="40" width="18" height="2.5" rx="1" fill="#c08457"/>
  <!-- Central column/pillar -->
  <path d="M21 24h6l-1 16h-4z" fill="#d99b6c"/>
  <path d="M24 24h3l-1 16h-2z" fill="#c08457" opacity="0.6"/>
  <!-- Angled top shelf / lectern desk -->
  <path d="M12 21.5l24-4.5 1 4-24 4.5z" fill="#b47b4d"/>
  <path d="M11 21l25-4.5 0.5 2-25 4.5z" fill="#e2a87a"/>
  
  <!-- Gooseneck microphone on the podium -->
  <!-- Mic base on desk -->
  <circle cx="28" cy="18" r="1.5" fill="#2d3748"/>
  <!-- Curved gooseneck stem reaching up and left -->
  <path d="M28 18 Q30 11 25 9" fill="none" stroke="#cbd5e0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Microphone head capsule pointing towards speaker -->
  <path d="M25 9 L22 7.5" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
  <circle cx="21" cy="7" r="2" fill="#e2e8f0"/>
</svg>
