name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: ["release/0.5.1"]
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install "pyinstaller==6.16.0"
      - name: Validate code and release version
        shell: pwsh
        run: |
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff falhou." }
          pytest
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam." }
          $version = python -c "from importlib.metadata import version; print(version('meeting-assistant'))"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag e versão do pacote não correspondem."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build and smoke-test packaged app
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAssistant-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release/0.5.1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from importlib.metadata import version; print(version('meeting-assistant'))"
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/heads/*' -and $env:GITHUB_REF_NAME -ne "release/$version") {
            throw "Branch e versão do pacote não correspondem."
          }
          $notes = @"
          ## Meeting Assistant $tag
          Instalador para Windows 10/11 x64, com runtime Python e bibliotecas incluídos.

          - Diagnóstico local por padrão, exportação textual e sincronização opcional.
          - Recuperação de configurações inválidas com preservação do original.
          - Pré-verificação separa instalação, conexão, configuração e confirmação do operador.
          - Guia de operação, matriz de recuperação e procedimento de atualização/retorno incluídos.
          - Núcleo JWL ↔ Zoom ↔ Salão preservado. Áudio e câmera IP confirmados pelo responsável no equipamento atual em 24/09/2026.

          Build validado por lint, suíte automatizada, smoke test do executável e compilação do instalador.
          OBS Studio, Zoom, JW Library e VB-CABLE continuam sendo componentes externos.
          Ensaios físicos específicos de recuperação e atualização/retorno permanecem documentados como pendentes. Ensaio completo em Windows limpo excluído desta entrega.
          Antes de atualizar, feche o app e faça backup privado de %APPDATA%\MeetingAssistant.
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            gh release create $tag release/* --title "Meeting Assistant $tag" --notes-file release-notes.md --verify-tag
          } else {
            gh release create $tag release/* --title "Meeting Assistant $tag" --notes-file release-notes.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicação da release falhou." }
