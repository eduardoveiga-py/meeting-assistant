name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pyinstaller>=6,<7"
      - name: Build executable
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/app.ico")) { throw "Ícone Windows não encontrado." }
          pyinstaller --clean --noconfirm packaging/MeetingAssistant.spec
          if (-not (Test-Path "dist/MeetingAssistant/MeetingAssistant.exe")) { throw "Executável não foi criado." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup não foi encontrado." }
          New-Item -ItemType Directory -Force release | Out-Null
          & $iscc "packaging/MeetingAssistant.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou com código $LASTEXITCODE." }
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "release/SHA256SUMS.txt" -Encoding ascii -Append
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAssistant-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          ## Meeting Assistant $tag
          Primeira compilação instalável para Windows 10/11 x64.
          O instalador inclui o runtime Python e as bibliotecas Python necessárias para o Meeting Assistant.
          OBS Studio, Zoom, JW Library e VB-CABLE continuam sendo componentes externos.
          O núcleo JWL ↔ Zoom ↔ Salão foi validado pelo operador em 21/09/2026 e está protegido por checkpoint.
          O instalador e o áudio integrado ainda precisam de ensaio em máquina limpa antes de serem considerados certificados para uso em reunião.
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag release/* --title "Meeting Assistant $tag" --notes-file release-notes.md --verify-tag
