name: Windows Release
on:
  workflow_dispatch:
  push:
    branches: ['feature/meeting-launch-zoom-hall']
    paths: ['packaging/**', '.github/workflows/release.yml', 'docs/releases/**']
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Install Python package and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install "pyinstaller==6.16.0"
      - name: Validate code and release version
        shell: pwsh
        run: |
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff falhou." }
          pytest
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam." }
          $version = python -c "from importlib.metadata import version; print(version('meeting-assistant'))"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag e versão do pacote não correspondem."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build and smoke-test packaged app
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip update failed' }
          python -m pip install '.[dev]' 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
      - name: Verify source
        shell: pwsh
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Pytest failed' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'packaging/installer-preflight.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          python -c "from meeting_assistant.services.packaged_native import installation_script; from pathlib import Path; Path('elevation-check.ps1').write_text(installation_script('C:/Program Files/Meeting Assistant/native', 'D:/OBS Studio'), encoding='utf-8')"
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'elevation-check.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Build and verify native camera and OBS bridge
        shell: pwsh
        run: ./scripts/build-video-native.ps1
      - name: Download signed Microsoft runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/prerequisites | Out-Null
          Invoke-WebRequest 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile build/prerequisites/vc_redist.x64.exe
          $signature = Get-AuthenticodeSignature build/prerequisites/vc_redist.x64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Microsoft runtime signature validation failed'
          }
      - name: Build executable and verify bundled runtime
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/MeetingAssistant.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          $process = Start-Process dist/MeetingAssistant/MeetingAssistant.exe -ArgumentList '--self-check runtime-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged runtime failed' }
          $check = Get-Content runtime-check.json -Raw | ConvertFrom-Json
          if (-not $check.ok -or -not $check.frozen -or $check.app_version -ne '0.8.1') { throw 'Invalid runtime report' }
          Copy-Item -Recurse build/video-native/package dist/MeetingAssistant/native
          Compress-Archive -Path dist/MeetingAssistant -DestinationPath build/MeetingAssistant-0.8.1-Windows11-x64-portable.zip
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Build installer and checksums
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/MeetingAssistant.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          Copy-Item build/MeetingAssistant-0.8.1-Windows11-x64-portable.zip release
          Copy-Item runtime-check.json release
          Copy-Item docs/releases/v0.8.1.md release/RELEASE-NOTES.md
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingAssistant-Windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
  installer-check:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeetingAssistant-Windows-release
          path: release
      - name: Install, verify and uninstall app without an external Python
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'MeetingAssistant-installed'
          $settings = Join-Path $env:APPDATA 'MeetingAssistant/settings.json'
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          '{"release_test_marker":"preserve"}' | Set-Content $settings
          $settingsHash = (Get-FileHash $settings).Hash
          $installer = Resolve-Path release/MeetingAssistant-Setup-0.8.1.exe
          $process = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /COMPONENTS=app /DIR=`"$target`" /LOG=installer-check.log" -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "Installer failed: $($process.ExitCode)" }
          $process = Start-Process "$target/MeetingAssistant.exe" -ArgumentList '--self-check installed-runtime-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed app failed' }
          $report = Get-Content installed-runtime-check.json -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen) { throw 'Installed runtime report failed' }
          if (-not (Test-Path "$target/native/MeetingAssistantMediaSource.dll")) { throw 'Native bundle missing' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$target/native/install-video-native.ps1" -Component All -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installed native bundle integrity failed' }
          $process = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$target/MeetingAssistant.exe")) { throw 'Uninstall failed' }
          if (-not (Test-Path $settings) -or (Get-FileHash $settings).Hash -ne $settingsHash) { throw 'User settings not preserved' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-verification
          path: |
            installer-check.log
            installed-runtime-check.json
  publish:
    needs: [build, installer-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeetingAssistant-Windows-release
          path: release
      - name: Publish tested installer as release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.8.1 release/* --target "$GITHUB_SHA" --title 'Meeting Assistant 0.8.1 — Windows 11' --notes-file release/RELEASE-NOTES.md
