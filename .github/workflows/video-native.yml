name: Windows 11 video
on:
  push:
    branches: ['feature/**']
    paths: ['native/**', 'src/**', 'packaging/**', 'pyproject.toml', 'scripts/*video*', 'scripts/prepare-camera-source.py', '.github/workflows/video-native.yml']
  pull_request:
    paths: ['native/**', 'src/**', 'packaging/**', 'pyproject.toml', 'scripts/*video*', 'scripts/prepare-camera-source.py', '.github/workflows/video-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Build bridge and Windows 11 provider
        shell: pwsh
        run: ./scripts/build-video-native.ps1
      - name: Package application with Python runtime
        shell: pwsh
        run: |
          python -m pip install . "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw 'Application dependencies failed' }
          pyinstaller --clean --noconfirm packaging/MeetingAssistant.spec
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/MeetingAssistant/MeetingAssistant.exe')) { throw 'Application build failed' }
          $report = Join-Path $env:RUNNER_TEMP 'meeting-assistant-runtime-check.json'
          $app = Start-Process 'dist/MeetingAssistant/MeetingAssistant.exe' -ArgumentList @('--self-check', ('"' + $report + '"')) -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Packaged runtime check timed out' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged runtime check failed' }
          $result = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'Packaged Qt/video dependencies failed' }
          Get-Content $report
          Copy-Item 'dist/MeetingAssistant' 'build/video-native/package/MeetingAssistant' -Recurse
          Copy-Item $report 'build/video-native/package/RUNTIME-CHECK.json'
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-assistant-video-windows11-x64
          path: build/video-native/package/
          if-no-files-found: error
