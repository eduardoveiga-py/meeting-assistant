name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      MEETING_ASSISTANT_TESTING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate launch scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($name in @('run.ps1','ensure-video-native.ps1','python-environment.ps1','setup-dev.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "scripts/$name"), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        timeout-minutes: 8
        run: python -m pytest -vv --durations=15 -o faulthandler_timeout=60
