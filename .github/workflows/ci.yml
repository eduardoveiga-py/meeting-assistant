name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      MEETING_ASSISTANT_TESTING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate launch scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($name in @('run.ps1','ensure-video-native.ps1','ensure-jwl-capture.ps1','install-jwl-capture.ps1','build-jwl-capture.ps1','test-jwl-package.ps1','python-environment.ps1','setup-dev.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "scripts/$name"), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        timeout-minutes: 8
        env:
          MEETING_ASSISTANT_LAYOUT_CAPTURE_DIRECTORY: ${{ runner.temp }}/operator-layout
        run: python -m pytest -vv --durations=15 -o faulthandler_timeout=60

      - name: Save operator layout renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-layout
          path: ${{ runner.temp }}/operator-layout/*.png
          if-no-files-found: warn
          retention-days: 7
