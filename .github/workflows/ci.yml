name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate launch scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($name in @('run.ps1','ensure-video-native.ps1','python-environment.ps1','setup-dev.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "scripts/$name"), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyinstaller==6.16.0"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build and verify native camera and OBS bridge
        shell: pwsh
        run: ./scripts/build-video-native.ps1

      - name: Build and smoke-test packaged app
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload reviewed build
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAssistant-CI-Windows
          path: |
            release/*.exe
            dist/smoke-test.json
          if-no-files-found: error
          retention-days: 14
