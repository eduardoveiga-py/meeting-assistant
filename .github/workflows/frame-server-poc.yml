name: Frame Server camera PoC
on:
  push:
    branches: ['feature/**']
    paths: ['experiments/frame-server/**', '.github/workflows/frame-server-poc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Build unsigned, isolated Frame Server prototype
        shell: pwsh
        run: ./experiments/frame-server/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-assistant-frame-server-poc-UNSIGNED-x64
          path: build/frame-server/package/
          if-no-files-found: error
