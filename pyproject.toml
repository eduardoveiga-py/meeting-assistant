[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-assistant"
version = "0.4.2"
description = "Assistente de operação para reuniões com OBS, Zoom e JW Library"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "mss>=10,<11",
    "obsws-python>=1.8,<2",
    "psutil>=6,<8",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
meeting-assistant = "meeting_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meeting_assistant.resources" = ["*.svg"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
